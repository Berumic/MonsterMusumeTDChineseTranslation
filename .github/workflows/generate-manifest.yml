name: Generate translation manifest

on:
  push:
    branches:
      - main
    paths:
      - "translations/**"
      - "!translations/manifest.json"
      - "assets/**"
      - "!assets/manifest.json"
      - "scripts/generate_manifest.py"
      - ".github/workflows/generate-manifest.yml"

permissions:
  contents: write

concurrency:
  group: translation-manifest
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Generate manifest
        run: python scripts/generate_manifest.py

      - name: Commit manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add translations/manifest.json assets/manifest.json assets/android/manifest.json

          if git diff --cached --quiet; then
            echo "Manifest unchanged"
            exit 0
          fi

          git commit -m "chore: update translation manifest [skip ci]"
          git push
